services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splitmate}
      POSTGRES_USER: ${POSTGRES_USER:-splitmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - splitmate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitmate-postgres-data:
